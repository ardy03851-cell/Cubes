<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roboflow AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 92vh;
            max-height: 880px;
            background: #1a1a20;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
            border: 1px solid #2a2a32;
        }

        .chat-header {
            padding: 16px 22px;
            background: #202028;
            border-bottom: 1px solid #2e2e38;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80aa;
            flex-shrink: 0;
        }

        .dot.busy {
            background: #fbbf24;
            box-shadow: 0 0 8px #fbbf24aa;
        }

        .dot.err {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444aa;
        }

        .chat-header h1 {
            font-size: 15px;
            font-weight: 600;
            color: #e8e8ee;
        }

        .chat-header .sub {
            font-size: 11px;
            color: #6a6a7a;
            margin-left: auto;
            text-align: right;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #3a3a48;
            border-radius: 3px;
        }

        .msg {
            max-width: 84%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: fadeIn .22s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .msg.user {
            align-self: flex-end;
            background: #2b5ea7;
            color: #eef4ff;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            align-self: flex-start;
            background: #282833;
            color: #dcdce8;
            border: 1px solid #32323e;
            border-bottom-left-radius: 4px;
        }

        .msg.system {
            align-self: center;
            background: #2a1f22;
            color: #f0a0a0;
            border: 1px solid #4a2a2e;
            font-size: 12.5px;
            max-width: 95%;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        .msg.loading {
            align-self: flex-start;
            background: #282833;
            border: 1px solid #32323e;
            color: #8a8a9a;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #3a3a4a;
            border-top-color: #6a9eff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .input-area {
            padding: 14px 18px 16px;
            background: #202028;
            border-top: 1px solid #2e2e38;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .image-row label {
            font-size: 12px;
            color: #7a7a8a;
            white-space: nowrap;
        }

        .image-row input {
            flex: 1;
            background: #16161c;
            border: 1px solid #32323e;
            border-radius: 8px;
            padding: 7px 12px;
            color: #c8c8d4;
            font-size: 12px;
            outline: none;
        }

        .image-row input:focus {
            border-color: #4a6aaa;
        }

        .image-row input::placeholder {
            color: #4a4a58;
        }

        .text-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .text-row textarea {
            flex: 1;
            background: #16161c;
            border: 1px solid #32323e;
            border-radius: 12px;
            padding: 11px 14px;
            color: #e8e8ee;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 46px;
            max-height: 130px;
            line-height: 1.4;
        }

        .text-row textarea:focus {
            border-color: #4a6aaa;
        }

        .text-row textarea::placeholder {
            color: #4a4a58;
        }

        .text-row button {
            background: #2b5ea7;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            height: 46px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, transform .1s;
            white-space: nowrap;
        }

        .text-row button:hover:not(:disabled) {
            background: #3a6fbf;
        }

        .text-row button:active:not(:disabled) {
            transform: scale(.97);
        }

        .text-row button:disabled {
            background: #2a2a34;
            color: #5a5a6a;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #4a4a58;
            text-align: center;
            gap: 8px;
            user-select: none;
        }

        .empty-state .icon {
            font-size: 40px;
            opacity: .4;
        }

        .empty-state p {
            font-size: 14px;
        }

        .empty-state small {
            font-size: 12px;
            color: #3a3a48;
        }

        .empty-state code {
            color: #5a6a9a;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="dot" id="statusDot"></div>
            <h1>Roboflow AI Chat</h1>
            <div class="sub" id="statusText">claude-fable-5-open-prompt</div>
        </div>

        <div class="messages" id="messages">
            <div class="empty-state" id="emptyState">
                <div class="icon">💬</div>
                <p>Start a conversation</p>
                <small>Type a message below and press Send</small>
                <small><code id="originHint"></code></small>
            </div>
        </div>

        <div class="input-area">
            <div class="image-row">
                <label for="imageUrl">🖼 Image URL</label>
                <input type="text" id="imageUrl" placeholder="Optional — only sent if filled in" />
            </div>
            <div class="text-row">
                <textarea id="userInput" placeholder="Type your message…  (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
                <button id="sendBtn" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        /* ────────────────────────────────────────────────────────────────
   CONFIG
   ──────────────────────────────────────────────────────────────── */
const API_KEY = 'rf_Qt8B4oHpwvRWOJNIW2r91L4eegC2';

// Roboflow "serverless workflow" endpoint. The canonical path is
//   https://serverless.roboflow.com/infer/workflows/{workspace}/{workflow}
// The second entry is the older/shorter form, tried as a fallback.
const ENDPOINTS = [
  'https://serverless.roboflow.com/infer/workflows/oleksandr-lahoza/claude-fable-5-open-prompt',
  'https://serverless.roboflow.com/oleksandr-lahoza/workflows/claude-fable-5-open-prompt'
];

/* ────────────────────────────────────────────────────────────────
   DOM
   ──────────────────────────────────────────────────────────────── */
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const userInput  = document.getElementById('userInput');
const sendBtn    = document.getElementById('sendBtn');
const imageUrlEl = document.getElementById('imageUrl');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const originHint = document.getElementById('originHint');

let isSending = false;

/* Warn early if the page was opened straight off disk — this is the
   #1 cause of "Load failed" / "Failed to fetch" in browsers. */
if (location.protocol === 'file:') {
  originHint.textContent = '⚠ Opened via file:// — if requests fail, serve over http://';
}

/* ────────────────────────────────────────────────────────────────
   UI helpers
   ──────────────────────────────────────────────────────────────── */
function addMessage(text, role) {
  if (emptyState && emptyState.parentNode) emptyState.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function addLoading(label) {
  const div = document.createElement('div');
  div.className = 'msg loading';
  const sp = document.createElement('div');
  sp.className = 'spinner';
  div.appendChild(sp);
  div.appendChild(document.createTextNode(label || 'Thinking…'));
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function setStatus(state, text) {
  statusDot.className = 'dot' + (state ? ' ' + state : '');
  if (text) statusText.textContent = text;
}

function setSending(state) {
  isSending = state;
  sendBtn.disabled = state || !userInput.value.trim();
  userInput.disabled = state;
}

/* ────────────────────────────────────────────────────────────────
   Response parsing
   ──────────────────────────────────────────────────────────────── */
function extractText(data) {
  if (typeof data === 'string') return data;
  if (!data || typeof data !== 'object') return String(data);

  const outputs = data.outputs;
  if (!outputs || typeof outputs !== 'object') {
    if (data.error) return 'API error: ' + JSON.stringify(data.error);
    return JSON.stringify(data, null, 2);
  }

  for (const key of Object.keys(outputs)) {
    const val = outputs[key];
    if (typeof val === 'string' && val.trim()) return val;
    if (val && typeof val === 'object' && typeof val.value === 'string' && val.value.trim()) {
      return val.value;
    }
    if (Array.isArray(val)) {
      const joined = val
        .map(i => (typeof i === 'string' ? i : (i && i.value) || ''))
        .join(' ')
        .trim();
      if (joined) return joined;
    }
  }
  return JSON.stringify(outputs, null, 2);
}

/* ────────────────────────────────────────────────────────────────
   Network
   ──────────────────────────────────────────────────────────────── */
function isNetworkError(err) {
  // Chrome: "Failed to fetch" / Firefox: "NetworkError..." /
  // Safari: "Load failed"  → all TypeError from fetch()
  return err instanceof TypeError ||
         /load failed|failed to fetch|networkerror|network request failed/i.test(err.message || '');
}

async function postWorkflow(url, prompt, imageUrl) {
  const inputs = { prompt };
  // Only include the image input when the user actually supplied a URL,
  // so text-only workflows don't reject an unexpected field.
  if (imageUrl) {
    inputs.image = { type: 'url', value: imageUrl };
  }

  const res = await fetch(url, {
    method: 'POST',
    mode: 'cors',
    credentials: 'omit',
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ api_key: API_KEY, inputs })
  });

  const raw = await res.text();

  if (!res.ok) {
    const err = new Error('HTTP ' + res.status + ' ' + res.statusText + '\n' + raw.slice(0, 600));
    err.status = res.status;
    err.raw = raw;
    throw err;
  }

  try {
    return JSON.parse(raw);
  } catch {
    return { outputs: { text: raw } };
  }
}

async function callWorkflow(prompt, imageUrl) {
  const attempts = [];

  for (let i = 0; i < ENDPOINTS.length; i++) {
    const url = ENDPOINTS[i];
    const host = url.replace('https://serverless.roboflow.com', '…');
    try {
      setStatus('busy', 'Contacting ' + host);
      const data = await postWorkflow(url, prompt, imageUrl);
      setStatus('', 'Connected');
      return data;
    } catch (err) {
      attempts.push(host + ' → ' + (err.message || err));

      // Network failure OR a "endpoint not found"-style status → try next URL.
      const retryable = isNetworkError(err) ||
                        err.status === 404 || err.status === 405 || err.status === 400;
      if (!retryable || i === ENDPOINTS.length - 1) {
        const e = new Error(attempts.join('\n\n'));
        e.network = isNetworkError(err);
        e.attempts = attempts;
        throw e;
      }
    }
  }
}

/* ────────────────────────────────────────────────────────────────
   Send
   ──────────────────────────────────────────────────────────────── */
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isSending) return;

  addMessage(text, 'user');
  userInput.value = '';
  autoResize();

  const imageUrl = imageUrlEl.value.trim();
  const loadingEl = addLoading('Thinking…');
  setSending(true);

  try {
    const result = await callWorkflow(text, imageUrl);
    console.log('Roboflow raw response:', result);
    loadingEl.remove();
    addMessage(extractText(result), 'ai');
    setStatus('', 'Connected');
  } catch (err) {
    loadingEl.remove();
    console.error('Roboflow request failed:', err);

    let hint = '';
    if (err.network) {
      hint =
        '\n\nPossible causes:\n' +
        '• The page is open as file:// — serve it over http instead ' +
        '(e.g. run  python3 -m http.server  then open http://localhost:8000)\n' +
        '• An extension / VPN / firewall is blocking serverless.roboflow.com\n' +
        '• No internet connection';
      setStatus('err', 'Network error');
    } else {
      hint = '\n\nCheck the API key, workspace slug and workflow ID.';
      setStatus('err', 'Request rejected');
    }

    addMessage('⚠️ Request failed\n\n' + (err.message || err) + hint, 'system');
  } finally {
    setSending(false);
    userInput.focus();
  }
}

/* ────────────────────────────────────────────────────────────────
   Input behaviour
   ──────────────────────────────────────────────────────────────── */
function autoResize() {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 130) + 'px';
}

sendBtn.addEventListener('click', sendMessage);

userInput.addEventListener('input', () => {
  autoResize();
  sendBtn.disabled = !userInput.value.trim() || isSending;
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage();
  }
});

userInput.focus();
    </script>
</body>

</html>
